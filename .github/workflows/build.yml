name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege for the default GITHUB_TOKEN: the build only reads.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test the library and the bridge, attach sources and javadoc
        # The AgentSpaces 0.3.0 artifacts resolve from Maven Central. The example
        # (-Pexamples) needs example-02-research-fleet, which is not published, and
        # the host passthroughs (-Phosts) need Micronaut on JDK 25; both run in the
        # workspace gate (verify-all.sh) rather than here. The publication profile
        # runs unsigned so a javadoc or packaging problem fails the pull request.
        run: mvn -B -ntp verify -Pcentral-publish -Dgpg.skip=true
  grab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install the library into the local repository
        run: mvn -B -ntp install -DskipTests
      - name: Install Groovy 6.0.0
        run: |
          curl -s "https://get.sdkman.io?rcupdate=false" | bash
          bash -lc 'source "$HOME/.sdkman/bin/sdkman-init.sh" && sdk install groovy 6.0.0 < /dev/null'
      - name: Run the README's @Grab script against the local repository (GR-D-05)
        run: ci/grab-check.sh "$HOME/.sdkman/candidates/groovy/6.0.0/bin/groovy"
